io:
  input_dir: input               # branch mask input folder
  output_dir: output             # reconnect output folder

shared:
  filament_width_px: null        # set by stringart when available

thresholds:
  # Shared extraction and candidate search defaults.
  # Reconnect geometry gates are stage-local below.
  branch_bin: 0.5                # binary mask threshold
  min_component_area: 15         # smallest initial branch component
  search_size_px: 40             # local candidate search window
  candidate_layers: all          # branch layers to compare
  max_width_ratio: 2.75          # maximum width mismatch

overlap:
  mode: trim                     # kill = drop smaller overlap; trim = keep viable non-overlap fragments
  kill_thr: 0.3                  # overlap fraction above which kill/trim action triggers
  min_keep_area: 15              # smallest kept trimmed fragment
  trim_dilate_px: 10              # 0 disables halo; >0 uses a temporary larger-component overlap-test halo

morphology:
  dilate_px: 1                   # label dilation radius
  tip_dir_steps: 10              # pixels used for tip direction

preprocess:
  clean_min_area: 5              # smallest pre-score component
  skeletonize_components: true   # score skeletonized components
  component_mask_mode: skeletonized # mask used for component scoring
  split_at_branchpoints: false   # split skeleton branch junctions
  bp_dilate_px: 2                # branchpoint split radius

geometry:
  # Shared tip tracing, bridge sampling, and endpoint cleanup settings.
  trace_steps: 28                # tip trace length
  fit_points: 12                 # points for local fit
  smooth_trace_points: 22        # trace points for smoothness
  bridge_samples: 24             # sampled bridge points
  bridge_tangent_scale: 0.3      # Hermite handle length
  bridge_clearance_px: 0         # extra bridge clearance
  max_component_tips: 16         # maximum tips per component
  min_tip_trace_len_px: 0.0      # minimum usable tip trace
  tip_prune_spur_px: 3           # remove skeleton spurs that rejoin a junction within this many px
  tip_dedupe_sep_px: 4.0         # cluster endpoint tips closer than this after support scoring

weights:
  distance: 1.0                  # distance score weight
  forward: 2.0                   # forward alignment weight
  opposition: 1.0                # opposition score weight
  line_residual: 2.0             # residual score weight
  width_ratio: 0.25              # width mismatch weight
  curvature_delta: 0.55          # curvature mismatch weight
  smooth_rms: 2.6                # smoothness RMS weight
  smooth_curvature: 1.1          # smooth curvature weight
  bridge_intrusion: 2.0          # intrusion penalty weight
  length_reward: 0.2             # long-merge reward

outputs:
  save_raw_labels: true          # write raw labels
  save_dilated_labels: true      # write dilated labels
  save_overlay: true             # write overlay preview
  overlay_alpha: 0.3             # overlay blend strength
  save_label_previews: true      # write label preview images

debug:
  rejection_log_path: output/rejection_log_straight.csv # candidate log CSV

runtime:
  verbose: true                  # print progress output
  print_every_pass: 1            # pass logging interval
  print_every_merge: 20          # merge logging interval
  max_merges_per_pass: 100       # merge cap per pass
  max_passes: 10                 # fallback pass cap

# Stage 1: clear_merge
# Tiny, straight, high-confidence endpoint gaps only
stage_clear:
  runtime:
    stage_name: clear_merge      # short clean-gap pass
    max_passes: 6                # clear-merge pass count
  thresholds:
    merge_mode: clear            # only clear-merge candidates can be accepted
    max_tip_distance_px: 16      # search cap for clear gaps
    max_curvature_delta: 0.16    # reject mismatched local curvature even for clear gaps
    max_bridge_intrusion_frac: 0.22 # short-gap intrusion cap
    clear_merge_max_dist_px: 16.0 # clear merge distance cap
    clear_merge_max_line_resid_px: 6.0 # clear merge residual cap
    clear_merge_min_opposition: 0.6 # clear merge opposition
    clear_merge_overrun_max_dist_px: 24.0 # longer clear merge only for long collinear endpoints that overshot each other
    clear_merge_multitip_min_forward_cos: 0.0 # require non-backward clear merges into multi-tip components
    clear_merge_backward_max_layer_gap: 4 # block backward clear merges across distant circular orientation bins

# Stage 2: strict_tip_reconnect
# Close endpoint reconnects with normal forward, opposition, residual, smoothness, and turn gates.
stage_strict:
  runtime:
    stage_name: strict_tip_reconnect # previous strict/short reconnect pass
    max_passes: 8                # short-gap pass count
  thresholds:
    merge_mode: normal           # use the full normal evaluator
    max_tip_distance_px: 15      # short-gap distance cap
    min_forward_cos: 0.85        # stricter forward alignment
    min_inward_opposition: 0.55  # stricter tip opposition
    max_turn_deg: 45.0           # short-gap turn cap
    max_line_residual_px: 6      # short-gap residual cap
    max_curvature_delta: 0.16    # short-gap curvature cap
    max_bridge_intrusion_frac: 0.22 # short-gap intrusion cap
    max_smooth_rms_px: 6.0       # short-gap smoothness cap
    max_arc_miss_frac: 0.55      # short-gap arc miss cap
    same_layer_max_line_resid_px: 20.0 # relaxed residual cap for same orientation-layer splits
    same_layer_min_forward_cos: 0.88 # forward gate for same-layer residual relaxation
    same_layer_min_opposition: 0.85 # opposition gate for same-layer residual relaxation

# Stage 3: relaxed_tip_reconnect
# Wider search with relaxed gates for longer but still smooth/consistent endpoint bridges.
stage_relaxed:
  runtime:
    stage_name: relaxed_tip_reconnect # previous relaxed/wider reconnect pass
    max_passes: 6                # wider pass count
  thresholds:
    merge_mode: normal           # use the full normal evaluator
    max_tip_distance_px: 55      # wider distance cap
    min_forward_cos: 0.72        # relaxed forward alignment
    min_inward_opposition: 0.4   # relaxed tip opposition
    max_turn_deg: 70.0           # wider turn cap
    max_line_residual_px: 16     # wider residual cap
    max_curvature_delta: 0.2     # wider curvature cap
    max_bridge_intrusion_frac: 0.32 # wider intrusion cap
    max_smooth_rms_px: 5.5       # wider smoothness cap
    max_arc_miss_frac: 0.75      # wider arc miss cap
    same_layer_max_line_resid_px: 20.0 # relaxed residual cap for same orientation-layer splits
    same_layer_min_forward_cos: 0.88 # forward gate for same-layer residual relaxation
    same_layer_min_opposition: 0.85 # opposition gate for same-layer residual relaxation
