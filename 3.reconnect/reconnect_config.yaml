io:
  input_dir: 'input'
  output_dir: 'output'

# Written automatically by stringart_tiles.py. Set manually if running reconnect
# standalone (null = use config defaults).
shared:
  filament_width_px: null

thresholds:
  branch_bin: 0.5
  min_component_area: 15
  overlap_kill_thr: 0.70
  search_size_px: 40
  candidate_layers: all
  max_tip_distance_px: 40
  min_forward_cos: 0.82
  min_inward_opposition: 0.50
  max_width_ratio: 2.75
  max_line_residual_px: 8
  max_curvature_delta: 0.16
  max_bridge_intrusion_frac: 0.20
  max_smooth_rms_px: 6.0
  max_turn_deg: 65.0
  max_arc_miss_frac: 0.65          # straight: arc extrapolation gate (1.0 = disabled)

morphology:
  dilate_px: 1                     # overridden at runtime if filament_width_px is known
  tip_dir_steps: 18

preprocess:
  clean_min_area: 5
  skeletonize_components: true
  split_at_branchpoints: false
  bp_dilate_px: 2

advanced:
  trace_steps: 28
  fit_points: 12
  smooth_trace_points: 22
  bridge_samples: 24
  bridge_tangent_scale: 0.30    # was 0.12 — longer Hermite handles give smoother junctions
  bridge_clearance_px: 0
  component_mask_mode: skeletonized
  max_component_tips: 16
  min_tip_trace_len_px: 0.0   # disabled — inter-branch stringart gaps produce valid 1-3px stubs

weights:
  distance: 0.50
  forward: 2.5
  opposition: 1.3
  line_residual: 2.8
  width_ratio: 0.25
  curvature_delta: 0.55
  smooth_rms: 2.6
  smooth_curvature: 1.1
  bridge_intrusion: 2.0
  length_reward: 0.01

outputs:
  save_raw_labels: true
  save_dilated_labels: true
  save_overlay: true
  overlay_alpha: 0.3
  save_label_previews: true

debug:
  rejection_log_path: 'output/rejection_log_straight.csv'

runtime:
  verbose: true
  print_every_pass: 1
  print_every_merge: 10
  max_merges_per_pass: 100
  max_passes: 10                   # ignored when stage1/stage2 are defined

stage1:
  runtime:
    max_passes: 4
  thresholds:
    max_tip_distance_px: 20
    min_forward_cos: 0.85        # was 0.90 — relaxed to catch near-perfect short-gap pairs
    min_inward_opposition: 0.55  # was 0.60
    max_turn_deg: 45.0
    max_line_residual_px: 6      # was 5
    max_bridge_intrusion_frac: 0.22  # was 0.15 — allows 1 crossing filament on a short bridge
    max_arc_miss_frac: 0.55

stage2:
  runtime:
    max_passes: 6
  thresholds:
    max_tip_distance_px: 55      # was 50
    min_forward_cos: 0.72
    min_inward_opposition: 0.40  # restored from 0.35 — 0.35 allowed too-perpendicular merges
    max_turn_deg: 70.0           # was 75 — slightly stricter to reduce bad bends
    max_line_residual_px: 16     # was 12 — catches offset pairs with good forward alignment
    max_curvature_delta: 0.20
    max_bridge_intrusion_frac: 0.32  # was 0.25
    max_smooth_rms_px: 5.5
    max_arc_miss_frac: 0.75


# ══════════════════════════════════════════════════════════════════════════
# CURVY-mode overrides (used when --version curvy)
# Only keys that differ from the base values above need to be listed.
# ══════════════════════════════════════════════════════════════════════════
curvy:
  thresholds:
    search_size_px: 45
    max_tip_distance_px: 45
    min_forward_cos: 0.78
    min_inward_opposition: 0.45
    max_line_residual_px: 10
    max_curvature_delta: 0.18
    max_smooth_rms_px: 6.5
    max_arc_miss_frac: 0.65       # kept for backward compat (unused in curvy logic)
    max_arc_miss_px: 15.0         # absolute arc-miss gate (px)
    max_turn_deg_hard_cap: 48.0   # absolute ceiling on turn relaxation
    max_turn_deg_arc_rescue: 32.0 # tighter cap when arc_ok rescues a failed line_resid pair
    # clear-merge: bypass forward_cos / max_turn / intrusion for obviously collinear pairs
    clear_merge_max_dist_px:       15.0
    clear_merge_max_line_resid_px:  4.0
    clear_merge_max_arc_miss_px:    5.0
    clear_merge_min_opposition:     0.85
    clear_merge_max_turn_deg:       70.0
    # same-direction absorb: remove tiny parallel duplicates
    same_dir_absorb_max_dist_px:       4.0
    same_dir_absorb_max_line_resid_px: 2.5
    same_dir_absorb_max_arc_miss_px:   5.0
    same_dir_absorb_min_parallel:      0.90
    same_dir_absorb_max_turn_deg:      180.0
  advanced:
    fit_points: 14
    bridge_tangent_scale: 0.14
    curv_relax_factor: 30.0
    max_curv_relax: 0.30
  weights:
    forward: 2.2
    opposition: 1.2
    line_residual: 2.0
    curvature_delta: 0.45
    smooth_rms: 2.4
    smooth_curvature: 1.0
    arc_miss: 0.8
  debug:
    rejection_log_path: 'output/reconnect_rejection_log.csv'
  stage1:
    runtime:
      max_passes: 4
    thresholds:
      max_tip_distance_px: 20
      min_forward_cos: 0.88
      min_inward_opposition: 0.55
      max_turn_deg: 45.0
      max_line_residual_px: 5
      max_arc_miss_px: 10.0
      max_bridge_intrusion_frac: 0.15
    advanced:
      curv_relax_factor: 15.0
      max_curv_relax: 0.15
  stage2:
    runtime:
      max_passes: 6
    thresholds:
      max_tip_distance_px: 60
      min_forward_cos: 0.72
      min_inward_opposition: 0.38
      max_turn_deg: 45.0
      max_line_residual_px: 12
      max_curvature_delta: 0.22
      max_bridge_intrusion_frac: 0.25
      max_smooth_rms_px: 5.0
      max_arc_miss_px: 12.0
    advanced:
      curv_relax_factor: 25.0
      max_curv_relax: 0.20
