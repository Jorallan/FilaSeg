io:
  input_dir: 'input'              # branch mask input folder
  output_dir: 'output'            # reconnect output folder

shared:
  filament_width_px: null         # set by stringart when available

thresholds:
  branch_bin: 0.5                 # binary mask threshold
  min_component_area: 15          # smallest kept component
  overlap_kill_thr: 0.70          # overlap removal threshold
  search_size_px: 40              # local candidate search window
  candidate_layers: all           # branch layers to compare
  max_tip_distance_px: 40         # farthest tip pair distance
  min_forward_cos: 0.82           # minimum forward alignment
  min_inward_opposition: 0.50     # minimum tip opposition
  max_width_ratio: 2.75           # maximum width mismatch
  max_line_residual_px: 8         # maximum straight-line residual
  max_curvature_delta: 0.16       # maximum curvature mismatch
  max_bridge_intrusion_frac: 0.20 # allowed crossing intrusion
  max_smooth_rms_px: 6.0          # maximum bridge roughness
  max_turn_deg: 65.0              # maximum join angle
  max_arc_miss_frac: 0.65         # straight arc extrapolation gate
  clear_merge_max_dist_px: 3.0    # bypass forward/opposition for tiny inter-bin gaps
  clear_merge_max_line_resid_px: 4.0  # collinearity gate for clear merge

morphology:
  dilate_px: 1                    # label dilation radius
  tip_dir_steps: 10               # pixels used for tip direction

preprocess:
  clean_min_area: 5               # smallest pre-score component
  skeletonize_components: true    # score skeletonized components
  split_at_branchpoints: false    # split skeleton branch junctions
  bp_dilate_px: 2                 # branchpoint split radius

advanced:
  trace_steps: 28                 # tip trace length
  fit_points: 12                  # points for local fit
  smooth_trace_points: 22         # trace points for smoothness
  bridge_samples: 24              # sampled bridge points
  bridge_tangent_scale: 0.30      # Hermite handle length
  bridge_clearance_px: 0          # extra bridge clearance
  component_mask_mode: skeletonized # mask used for component scoring
  max_component_tips: 16          # maximum tips per component
  min_tip_trace_len_px: 0.0       # minimum usable tip trace

weights:
  distance: 1.00                  # distance score weight
  forward: 2.0                    # forward alignment weight
  opposition: 1.0                 # opposition score weight
  line_residual: 2.0              # residual score weight
  width_ratio: 0.25               # width mismatch weight
  curvature_delta: 0.55           # curvature mismatch weight
  smooth_rms: 2.6                 # smoothness RMS weight
  smooth_curvature: 1.1           # smooth curvature weight
  bridge_intrusion: 2.0           # intrusion penalty weight
  length_reward: 0.2             # long-merge reward

outputs:
  save_raw_labels: true           # write raw labels
  save_dilated_labels: true       # write dilated labels
  save_overlay: true              # write overlay preview
  overlay_alpha: 0.3              # overlay blend strength
  save_label_previews: true       # write label preview images

debug:
  rejection_log_path: 'output/rejection_log_straight.csv' # candidate log CSV

runtime:
  verbose: true                   # print progress output
  print_every_pass: 1             # pass logging interval
  print_every_merge: 20           # merge logging interval
  max_merges_per_pass: 100        # merge cap per pass
  max_passes: 10                  # fallback pass cap

stage1:
  runtime:
    max_passes: 8                 # short-gap pass count
  thresholds:
    max_tip_distance_px: 15       # short-gap distance cap
    min_forward_cos: 0.85         # stricter forward alignment
    min_inward_opposition: 0.55   # stricter tip opposition
    max_turn_deg: 45.0            # short-gap turn cap
    max_line_residual_px: 6       # short-gap residual cap
    max_bridge_intrusion_frac: 0.22 # short-gap intrusion cap
    max_arc_miss_frac: 0.55       # short-gap arc miss cap

stage2:
  runtime:
    max_passes: 6                 # wider pass count
  thresholds:
    max_tip_distance_px: 55       # wider distance cap
    min_forward_cos: 0.72         # relaxed forward alignment
    min_inward_opposition: 0.40   # relaxed tip opposition
    max_turn_deg: 70.0            # wider turn cap
    max_line_residual_px: 16      # wider residual cap
    max_curvature_delta: 0.20     # wider curvature cap
    max_bridge_intrusion_frac: 0.32 # wider intrusion cap
    max_smooth_rms_px: 5.5        # wider smoothness cap
    max_arc_miss_frac: 0.75       # wider arc miss cap

# -----------------------------------------------------------------------------
# CURVY-mode overrides (used when --version curvy)
# -----------------------------------------------------------------------------
curvy:
  thresholds:
    search_size_px: 45            # curvy search window
    max_tip_distance_px: 45       # curvy distance cap
    min_forward_cos: 0.78         # curvy forward alignment
    min_inward_opposition: 0.45   # curvy tip opposition
    max_line_residual_px: 10      # curvy residual cap
    max_curvature_delta: 0.18     # curvy curvature cap
    max_smooth_rms_px: 6.5        # curvy smoothness cap
    max_arc_miss_frac: 0.65       # legacy arc miss gate
    max_arc_miss_px: 15.0         # absolute arc miss cap
    max_turn_deg_hard_cap: 48.0   # hard turn ceiling
    max_turn_deg_arc_rescue: 32.0 # arc-rescue turn cap
    clear_merge_max_dist_px: 15.0 # clear merge distance cap
    clear_merge_max_line_resid_px: 4.0 # clear merge residual cap
    clear_merge_max_arc_miss_px: 5.0 # clear merge arc cap
    clear_merge_min_opposition: 0.85 # clear merge opposition
    clear_merge_max_turn_deg: 70.0 # clear merge turn cap
    same_dir_absorb_max_dist_px: 4.0 # duplicate absorb distance
    same_dir_absorb_max_line_resid_px: 2.5 # duplicate absorb residual
    same_dir_absorb_max_arc_miss_px: 5.0 # duplicate absorb arc cap
    same_dir_absorb_min_parallel: 0.90 # duplicate parallel minimum
    same_dir_absorb_max_turn_deg: 180.0 # duplicate turn allowance
  advanced:
    fit_points: 14                # curvy fit points
    bridge_tangent_scale: 0.14    # curvy bridge handle length
    curv_relax_factor: 30.0       # curvature relaxation scale
    max_curv_relax: 0.30          # maximum relaxation amount
  weights:
    forward: 2.2                  # curvy forward weight
    opposition: 1.2               # curvy opposition weight
    line_residual: 2.0            # curvy residual weight
    curvature_delta: 0.45         # curvy curvature weight
    smooth_rms: 2.4               # curvy smoothness weight
    smooth_curvature: 1.0         # curvy curvature smoothness
    arc_miss: 0.8                 # curvy arc miss weight
  debug:
    rejection_log_path: 'output/reconnect_rejection_log.csv' # curvy candidate log
  stage1:
    runtime:
      max_passes: 4               # curvy short-gap passes
    thresholds:
      max_tip_distance_px: 20     # curvy short distance cap
      min_forward_cos: 0.88       # curvy short forward gate
      min_inward_opposition: 0.55 # curvy short opposition
      max_turn_deg: 45.0          # curvy short turn cap
      max_line_residual_px: 5     # curvy short residual cap
      max_arc_miss_px: 10.0       # curvy short arc cap
      max_bridge_intrusion_frac: 0.15 # curvy short intrusion
    advanced:
      curv_relax_factor: 15.0     # curvy short relaxation
      max_curv_relax: 0.15        # curvy short max relaxation
  stage2:
    runtime:
      max_passes: 6               # curvy wider passes
    thresholds:
      max_tip_distance_px: 60     # curvy wider distance cap
      min_forward_cos: 0.72       # curvy wider forward gate
      min_inward_opposition: 0.38 # curvy wider opposition
      max_turn_deg: 45.0          # curvy wider turn cap
      max_line_residual_px: 12    # curvy wider residual cap
      max_curvature_delta: 0.22   # curvy wider curvature cap
      max_bridge_intrusion_frac: 0.25 # curvy wider intrusion
      max_smooth_rms_px: 5.0      # curvy wider smoothness
      max_arc_miss_px: 12.0       # curvy wider arc cap
    advanced:
      curv_relax_factor: 25.0     # curvy wider relaxation
      max_curv_relax: 0.20        # curvy wider max relaxation
