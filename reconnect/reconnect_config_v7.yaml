io:
  input_dir: 'input'
  output_dir: 'output'

shared:
  filament_width_px: null

thresholds:
  branch_bin: 0.5
  min_component_area: 15
  overlap_kill_thr: 0.70
  search_size_px: 45
  candidate_layers: all
  # v7: slightly looser base gates — curvature relaxation handles the rest
  max_tip_distance_px: 45
  min_forward_cos: 0.78
  min_inward_opposition: 0.45
  max_width_ratio: 2.75
  max_line_residual_px: 10
  max_curvature_delta: 0.18
  max_bridge_intrusion_frac: 0.20
  max_smooth_rms_px: 6.5
  max_turn_deg: 65.0
  max_arc_miss_frac: 0.65          # kept for backward compat (unused in v7 logic)
  max_arc_miss_px: 15.0            # v7: absolute arc-miss gate (px)
  max_turn_deg_hard_cap: 48.0      # v7: absolute ceiling on turn relaxation (was 75, still allowed kinks)
  max_turn_deg_arc_rescue: 32.0    # v7: tighter cap when arc_ok rescues a failed line_resid pair
  # v7 ⑦ clear-merge override: when a pair is unambiguously collinear and
  # opposed, bypass forward_cos / max_turn_deg / intrusion_frac gates that
  # are noise-sensitive at short distances.
  clear_merge_max_dist_px:       15.0
  clear_merge_max_line_resid_px:  4.0
  clear_merge_max_arc_miss_px:    5.0
  clear_merge_min_opposition:     0.85

morphology:
  dilate_px: 1
  tip_dir_steps: 18

preprocess:
  clean_min_area: 5
  skeletonize_components: true
  split_at_branchpoints: false
  bp_dilate_px: 2

advanced:
  trace_steps: 28
  fit_points: 14                   # slightly more points for better curvature estimate
  smooth_trace_points: 22
  bridge_samples: 24
  bridge_tangent_scale: 0.14
  bridge_clearance_px: 0
  component_mask_mode: skeletonized
  max_component_tips: 8
  min_tip_trace_len_px: 3.0
  curv_relax_factor: 30.0          # v7: curvature × factor → cosine slack
  max_curv_relax: 0.30             # v7: cap on curvature-driven angular slack

weights:
  distance: 0.50
  forward: 2.2
  opposition: 1.2
  line_residual: 2.0               # downweighted vs v6: arc_miss now shares this role
  width_ratio: 0.25
  curvature_delta: 0.45
  smooth_rms: 2.4
  smooth_curvature: 1.0
  bridge_intrusion: 2.0
  length_reward: 0.01
  arc_miss: 0.8                    # v7: arc prediction agreement

outputs:
  save_raw_labels: true
  save_dilated_labels: true
  save_overlay: true
  overlay_alpha: 0.3
  save_label_previews: true

debug:
  # CSV log of every pair considered during reconnect. Set to null to disable.
  # Columns: stage, ids, tip coords, reject reason, all gate metrics.
  rejection_log_path: 'output/reconnect_rejection_log.csv'

runtime:
  verbose: true
  print_every_pass: 1
  print_every_merge: 10
  max_merges_per_pass: 100
  max_passes: 10

# Two-stage: stage1 = strict straight connections; stage2 = allows curved gaps
stage1:
  runtime:
    max_passes: 4
  thresholds:
    max_tip_distance_px: 20
    min_forward_cos: 0.88
    min_inward_opposition: 0.55
    max_turn_deg: 45.0
    max_line_residual_px: 5
    max_arc_miss_px: 10.0
    max_bridge_intrusion_frac: 0.15
  advanced:
    curv_relax_factor: 15.0        # conservative in stage1
    max_curv_relax: 0.15

stage2:
  runtime:
    max_passes: 6
  thresholds:
    max_tip_distance_px: 60        # slight bump to help gentle-curve gaps
    min_forward_cos: 0.72          # tighter base — relaxation no longer collapses below ~0.45
    min_inward_opposition: 0.38
    max_turn_deg: 45.0             # hard_cap of 48 is the actual ceiling anyway
    max_line_residual_px: 12
    max_curvature_delta: 0.22
    max_bridge_intrusion_frac: 0.25
    max_smooth_rms_px: 5.0
    max_arc_miss_px: 12.0          # match max_line_residual so arc rescue only fires when arc is genuinely small
  advanced:
    curv_relax_factor: 25.0        # less aggressive — prevents forward_cos collapse
    max_curv_relax: 0.20
