io:
  input_dir: 'input'       # folder with input branch masks
  output_dir: 'output'     # folder for outputs

# Written automatically by stringart_tiles.py when run before reconnect.
# Set manually if running reconnect standalone (null = use config defaults).
shared:
  filament_width_px: null

thresholds:
  branch_bin: 0.5                  # binarization threshold for input masks
  min_component_area: 15           # discard very small components before reconnecting
  overlap_kill_thr: 0.70           # reject merges with too much overlap/conflict
  search_size_px: 40               # local search radius around each endpoint
  candidate_layers: all            # which candidate rings/layers to search; all = unrestricted
  # Geometric gates — used as-is when stage1/stage2 are not defined
  max_tip_distance_px: 40
  min_forward_cos: 0.82
  min_inward_opposition: 0.50
  max_width_ratio: 2.75
  max_line_residual_px: 8
  max_curvature_delta: 0.16
  max_bridge_intrusion_frac: 0.20
  max_smooth_rms_px: 6.0
  max_turn_deg: 65.0
  max_arc_miss_frac: 0.65          # arc extrapolation gate (1.0 = disabled); lower = stricter

morphology:
  dilate_px: 1                     # overridden at runtime if filament_width_px is known
  tip_dir_steps: 18

preprocess:
  clean_min_area: 5
  skeletonize_components: true
  split_at_branchpoints: false
  bp_dilate_px: 2

advanced:
  trace_steps: 28
  fit_points: 12
  smooth_trace_points: 22
  bridge_samples: 24
  bridge_tangent_scale: 0.12
  bridge_clearance_px: 0
  component_mask_mode: skeletonized  # default v6 mode; matches v5-style thin component masks
  max_component_tips: 8
  min_tip_trace_len_px: 3.0

weights:
  distance: 0.50
  forward: 2.5
  opposition: 1.3
  line_residual: 2.8
  width_ratio: 0.25
  curvature_delta: 0.55
  smooth_rms: 2.6
  smooth_curvature: 1.1
  bridge_intrusion: 2.0
  length_reward: 0.01

outputs:
  save_raw_labels: true
  save_dilated_labels: true
  save_overlay: true
  overlay_alpha: 0.3
  save_label_previews: true

runtime:
  verbose: true
  print_every_pass: 1
  print_every_merge: 10
  max_merges_per_pass: 100
  max_passes: 10                   # ignored when stage1/stage2 are defined

# Two-stage reconnection: stage1 locks in high-confidence merges with strict
# gates; stage2 then relaxes to recover harder cases on cleaner geometry.
# Only thresholds that differ from the base values above need to be listed.
stage1:
  runtime:
    max_passes: 4
  thresholds:
    max_tip_distance_px: 20
    min_forward_cos: 0.90
    min_inward_opposition: 0.60
    max_turn_deg: 45.0
    max_line_residual_px: 5
    max_bridge_intrusion_frac: 0.15
    max_arc_miss_frac: 0.55        # stricter arc gate in stage 1

stage2:
  runtime:
    max_passes: 6
  thresholds:
    max_tip_distance_px: 50
    min_forward_cos: 0.72
    min_inward_opposition: 0.40
    max_turn_deg: 75.0
    max_line_residual_px: 12
    max_curvature_delta: 0.20
    max_bridge_intrusion_frac: 0.25
    max_smooth_rms_px: 5.5         # slightly more tolerant in stage 2 so curved continuations survive
    max_arc_miss_frac: 0.75        # relax arc extrapolation for circular / bowed continuations
